# pages.yml
# ---
# builds every demo design system into one static site and deploys it to
# GitHub Pages: <base>/<design-system>/, with <base>/ redirecting to the first.
#
# one-time setup: Settings → Pages → Source: GitHub Actions.
# ---

name: pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v6
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build
        working-directory: demo
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v5
