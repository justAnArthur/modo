# ci.yml
# ---
# lint, typecheck and test on every push to main and every pull request; on
# pull requests also build the demo site, and smoke-test the packed lib.
# ---

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # The design systems type @justanarthur/modo/config from the lib's dist.
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - name: ui tarball contents
        run: .github/scripts/check-ui-pack.sh

  # pages.yml builds it on main; this catches a broken site before the merge.
  site:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build
        working-directory: demo
        env:
          SITE_BASE: /

  # `npm pack` the lib, `modo init` with it, install the tarball and build.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: .github/scripts/smoke-init.sh
