<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>modo: docs for your design system</title>
    <meta name="description" content="{{description}}" />
    <link rel="icon" type="image/svg+xml" href="{{favicon}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="modo" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{og}}" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./tokens/colors.css" />
    <style>
      :root {
        --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --font-size-display: clamp(2rem, 1.4rem + 3vw, 3.25rem);
        --font-size-lead: 1.125rem;
        --font-size-body: 1rem;
        --font-size-sm: 0.875rem;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --radius-md: 10px;
        --radius-lg: 16px;
        --measure: 64rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: var(--font-size-body) / 1.5 var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
        border-radius: var(--radius-md);
      }

      .page {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 24px 24px 48px;
        display: flex;
        flex-direction: column;
        gap: 72px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      header svg {
        display: block;
        height: 26px;
        width: auto;
      }

      nav {
        display: flex;
        gap: 4px;
        font-size: var(--font-size-sm);
        color: var(--muted-foreground);
      }

      nav a {
        padding: 6px 10px;
        border-radius: var(--radius-md);
      }

      nav a:hover {
        background: var(--hover);
        color: var(--foreground);
      }

      main {
        display: flex;
        flex-direction: column;
        gap: inherit;
      }

      .intro {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 48px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 40rem;
      }

      /* The logo's mark, large: a component drops into the page it documents. */
      .drop {
        width: 216px;
        height: 216px;
        display: block;
      }

      .drop .frame {
        stroke: var(--foreground);
      }

      .drop .piece {
        fill: var(--foreground);
        animation: drop 720ms cubic-bezier(0.2, 0.9, 0.3, 1) 200ms both;
      }

      /* Motion only, never opacity: a paused or throttled animation must still show the piece. */
      @keyframes drop {
        from {
          translate: -6px -10px;
        }
      }

      @media (max-width: 56rem) {
        .intro {
          grid-template-columns: minmax(0, 1fr);
        }

        .drop {
          display: none;
        }
      }

      h1 {
        margin: 0;
        font-size: var(--font-size-display);
        font-weight: var(--font-weight-semibold);
        line-height: 1.1;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }

      .lead {
        margin: 0;
        font-size: var(--font-size-lead);
        color: var(--muted-foreground);
        text-wrap: pretty;
      }

      .install {
        align-self: flex-start;
        margin: 4px 0 0;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--card);
        font: var(--font-size-sm) / 1.4 var(--font-mono);
        user-select: all;
      }

      .install span {
        color: var(--muted-foreground);
        user-select: none;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      h2 {
        margin: 0;
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--muted-foreground);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
        gap: 12px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--card);
        transition: border-color 120ms;
      }

      .card:hover {
        border-color: var(--ring);
      }

      .card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: var(--font-weight-semibold);
      }

      .card-title span {
        color: var(--muted-foreground);
        transition: translate 120ms;
      }

      .card:hover .card-title span {
        translate: 3px 0;
      }

      .card p {
        margin: 0;
        font-size: var(--font-size-sm);
        color: var(--muted-foreground);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card code {
        margin-top: auto;
        padding-top: 8px;
        font: var(--font-size-sm) / 1.4 var(--font-mono);
        color: var(--muted-foreground);
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: var(--font-size-sm);
        color: var(--muted-foreground);
      }

      footer a:hover {
        color: var(--foreground);
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .card-title span {
          transition: none;
        }

        .drop .piece {
          animation: none;
        }
      }

      @media (max-width: 40rem) {
        .page {
          gap: 48px;
          padding: 16px 16px 32px;
        }

        nav a:not(:first-child) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a href="{{base}}" aria-label="modo">{{logo}}</a>
        <nav>
          <a href="https://github.com/justAnArthur/modo">GitHub</a>
          <a href="https://www.npmjs.com/package/@justanarthur/modo">npm</a>
        </nav>
      </header>

      <main>
        <div class="intro">
          <div class="hero">
            <h1>Docs for your design system, built from your design system.</h1>
            <p class="lead">{{description}}</p>
            <code class="install"><span>$ </span>npm i -D @justanarthur/modo</code>
          </div>
          <svg class="drop" viewBox="0 0 32 32" aria-hidden="true">
            <rect class="frame" x="2" y="2" width="28" height="28" rx="8" fill="none" stroke-width="3.5" />
            <rect class="piece" x="13" y="13" width="17" height="17" rx="8" />
          </svg>
        </div>

        <section aria-labelledby="demos">
          <h2 id="demos">Design systems documented by modo</h2>
          <div class="cards">{{cards}}</div>
        </section>
      </main>

      <footer>
        <span>MIT</span>
        <a href="https://github.com/justAnArthur/modo">github.com/justAnArthur/modo</a>
        <a href="https://www.npmjs.com/package/@justanarthur/modo">@justanarthur/modo</a>
        <a href="https://www.npmjs.com/package/@justanarthur/modo-ui">@justanarthur/modo-ui</a>
      </footer>
    </div>
  </body>
</html>
